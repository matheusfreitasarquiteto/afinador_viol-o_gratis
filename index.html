<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Afinador Master</title><style>:root{color-scheme:dark;font-family:system-ui,Arial;background:#0c1324;color:#edf3ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px}.app{width:min(100%,520px);background:#172238;border:1px solid #34435e;border-radius:24px;padding:25px;box-shadow:0 20px 55px #0005}h1{margin:0 0 6px;text-align:center}p{color:#aebbd1;text-align:center}.note{text-align:center;font-size:80px;font-weight:800;margin:14px 0 0}.hz{text-align:center;color:#aebbd1}.meter{position:relative;height:82px;margin:20px 0 8px;border-radius:14px;background:linear-gradient(90deg,#b45b49,#d5b75e 30%,#45b985 50%,#d5b75e 70%,#b45b49);overflow:hidden}.meter:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:3px;background:#fff9}.needle{position:absolute;left:50%;top:5px;bottom:5px;width:5px;background:#0c1324;border:1px solid white;border-radius:5px;transform:translateX(-50%);transition:left .12s}.scale{display:flex;justify-content:space-between;color:#aebbd1;font-size:13px}.status{text-align:center;font-weight:700;font-size:20px;min-height:30px;margin:20px 0}.strings{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:15px 0}.strings button,.action{border:1px solid #506382;background:#263652;color:white;padding:13px 6px;border-radius:12px;font-size:15px;cursor:pointer}.strings button.selected{background:#3b7bcb;border-color:#8ac2ff}.action{width:100%;background:#317fd3;font-weight:700;font-size:17px;padding:15px}.secondary{margin-top:10px;background:#263652}.small{font-size:12px;line-height:1.5}label{display:block;text-align:center;margin:16px 0;color:#cbd5e1}input{accent-color:#64a9ff}</style></head><body><main class="app"><h1>🎸 Afinador Master</h1><p>Afinação padrão · E A D G B E</p><div class="note" id="note">—</div><div class="hz" id="freq">Aguardando microfone</div><div class="meter"><div class="needle" id="needle"></div></div><div class="scale"><span>−50 cents · Grave</span><span>0</span><span>Agudo · +50</span></div><div class="status" id="status">Selecione uma corda e inicie</div><div class="strings" id="strings"></div><label><input type="checkbox" id="automatic" checked> Reconhecer corda automaticamente</label><button class="action" id="start">🎙️ Ativar microfone</button><button class="action secondary" id="reference">▶ Ouvir nota de referência</button><p class="small">Toque uma corda por vez, em local silencioso. O microfone precisa de permissão e HTTPS (ou localhost). O áudio é analisado no seu dispositivo.</p></main><script>
const notes=[{name:'Mi 6ª',short:'E',hz:82.4069},{name:'Lá 5ª',short:'A',hz:110},{name:'Ré 4ª',short:'D',hz:146.8324},{name:'Sol 3ª',short:'G',hz:196},{name:'Si 2ª',short:'B',hz:246.9417},{name:'Mi 1ª',short:'E',hz:329.6276}];let selected=0,ctx,analyser,stream,raf,oscillator;const $=id=>document.getElementById(id),strings=$('strings');notes.forEach((n,i)=>{let b=document.createElement('button');b.textContent=n.name+' · '+n.short;b.onclick=()=>select(i);strings.appendChild(b)});function select(i){selected=i;[...strings.children].forEach((b,j)=>b.classList.toggle('selected',i===j));$('note').textContent=notes[i].short}select(0);
function detect(buf,sr){let N=buf.length,mean=0;for(let x of buf)mean+=x;mean/=N;let rms=0;for(let i=0;i<N;i++){buf[i]-=mean;rms+=buf[i]*buf[i]}rms=Math.sqrt(rms/N);if(rms<.012)return null;let min=Math.floor(sr/380),max=Math.min(Math.floor(sr/70),Math.floor(N/2)),best=Infinity,bestLag=0;for(let lag=min;lag<=max;lag++){let diff=0;for(let i=0;i<N-lag;i+=2){let d=buf[i]-buf[i+lag];diff+=d*d}diff/=Math.ceil((N-lag)/2);if(diff<best){best=diff;bestLag=lag}}if(!bestLag||best>rms*rms*.55)return null;
// Prefer the earliest convincing periodicity instead of a multiple of the period.
let threshold=Math.max(best*4,rms*rms*.10);
for(let lag=min+1;lag<=bestLag;lag++){
  let prev=difference(lag-1),cur=difference(lag),next=difference(lag+1);
  if(cur<prev&&cur<=next&&cur<threshold){bestLag=lag;best=cur;break}
}
let a=bestLag>min?difference(bestLag-1):best,b=best,c=bestLag<max?difference(bestLag+1):best;let shift=(a-c)/(2*(a-2*b+c)||1);let hz=sr/(bestLag+Math.max(-1,Math.min(1,shift)));return hz;function difference(lag){let s=0;for(let i=0;i<N-lag;i+=2){let d=buf[i]-buf[i+lag];s+=d*d}return s/Math.ceil((N-lag)/2)}}
async function start(){if(stream){stop();return}try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});ctx=new (window.AudioContext||window.webkitAudioContext)();await ctx.resume();let source=ctx.createMediaStreamSource(stream);analyser=ctx.createAnalyser();analyser.fftSize=8192;source.connect(analyser);$('start').textContent='■ Desativar microfone';loop()}catch(e){$('status').textContent='Não foi possível acessar o microfone';$('freq').textContent=e.message}}function stop(){cancelAnimationFrame(raf);stream?.getTracks().forEach(t=>t.stop());stream=null;ctx?.close();ctx=null;$('start').textContent='🎙️ Ativar microfone';$('status').textContent='Microfone desativado'}let frame=0;function loop(){raf=requestAnimationFrame(loop);if(++frame%5)return;let data=new Float32Array(analyser.fftSize);analyser.getFloatTimeDomainData(data);let hz=detect(data,ctx.sampleRate);if(!hz){$('freq').textContent='Toque uma corda';$('status').textContent='Aguardando som...';return}if($('automatic').checked){let closest=0,dist=Infinity;notes.forEach((n,i)=>{let d=Math.abs(Math.log2(hz/n.hz));if(d<dist){dist=d;closest=i}});select(closest)}let n=notes[selected],cents=1200*Math.log2(hz/n.hz);$('freq').textContent=hz.toFixed(1)+' Hz · alvo '+n.hz.toFixed(1)+' Hz · '+(cents>0?'+':'')+cents.toFixed(1)+' cents';$('needle').style.left=(50+Math.max(-50,Math.min(50,cents)))+'%';$('status').textContent=Math.abs(cents)<=5?'✓ Afinada!':cents<0?'↑ Aperte a corda (grave)':'↓ Solte a corda (aguda)'}$('start').onclick=start;let audioRefContext, referenceNodes=[];
$('reference').onclick=async()=>{
  try{
    if(!audioRefContext || audioRefContext.state==='closed')
      audioRefContext=new (window.AudioContext||window.webkitAudioContext)();
    await audioRefContext.resume();
    referenceNodes.forEach(o=>{try{o.stop()}catch(e){}});
    referenceNodes=[];
    const t=audioRefContext.currentTime, f=notes[selected].hz;
    const master=audioRefContext.createGain();
    master.gain.setValueAtTime(0,t);
    master.gain.linearRampToValueAtTime(0.26,t+0.035);
    master.gain.setValueAtTime(0.26,t+1.25);
    master.gain.exponentialRampToValueAtTime(0.001,t+1.65);
    master.connect(audioRefContext.destination);
    // Harmônicos permitem ouvir Mi, Lá e Ré graves em alto-falantes pequenos.
    [1,2,3,4].forEach((harmonic,i)=>{
      const osc=audioRefContext.createOscillator();
      const gain=audioRefContext.createGain();
      osc.type='sine';
      osc.frequency.setValueAtTime(f*harmonic,t);
      gain.gain.value=[0.38,0.48,0.28,0.16][i];
      osc.connect(gain).connect(master);
      osc.start(t);osc.stop(t+1.7);
      referenceNodes.push(osc);
    });
    $('status').textContent='▶ Referência: '+notes[selected].name;
  }catch(e){$('status').textContent='Erro ao reproduzir: '+e.message}
};
</script></body></html>
